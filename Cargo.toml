[package]
name = "calljet"
version = "0.1.0"
edition = "2021"
description = "On-demand static call-path analysis CLI for C and C++"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tree-sitter = "0.22"
tree-sitter-c = "0.21"
tree-sitter-cpp = "0.21"
clang-sys = { version = "1.8", features = ["runtime", "clang_6_0"] }

[dev-dependencies]
tempfile = "3.10"
